name: qemu

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # IGVM C wrapper might require a different Rust version than SVSM
  RUST_VERSION_IGVM: 1.84.1
  QEMU_REPO: https://github.com/coconut-svsm/qemu.git
  QEMU_REF: svsm-igvm
  IGVM_REPO: https://github.com/microsoft/igvm.git
  IGVM_REF: igvm-v0.3.4

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: QEMU NOCC test-in-svsm
    runs-on: ubuntu-latest
    steps:

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Query coconut-svsm/qemu repo
        run: |
          QEMU_SHA=$(git ls-remote "$QEMU_REPO" --exit-code "$QEMU_REF" | cut -f 1)
          echo "QEMU_SHA=${QEMU_SHA}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          fetch-depth: 1

      - name: Calculate SHA for qemu.yml
        run: |
          QEMU_YML_SHA=$(shasum .github/workflows/qemu.yml | awk '{print $1}')
          echo "QEMU_YML_SHA=${QEMU_YML_SHA}" >> "$GITHUB_ENV"

      - name: Get QEMU from cache
        id: qemu_cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: citests/qemu
          key: qemu-${{ env.QEMU_SHA }}--config-${{ env.QEMU_YML_SHA }}

      - if: ${{ steps.qemu_cache.outputs.cache-hit != 'true' }}
        name: Enable Ubuntu source repositories
        run: |
          sudo sed -i 's/^Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - if: ${{ steps.qemu_cache.outputs.cache-hit != 'true' }}
        name: Build QEMU
        run: |
          # Update & install dependencies
          sudo apt-get install --yes git curl libcunit1-dev
          # TODO: Find a minimal set of dependencies to install
          sudo apt-get build-dep --yes qemu

          OUT="$PWD/citests/qemu"
          mkdir -p "$OUT"

          # Set up a build directory outside the coconut-svsm checkout
          mkdir -p ../scratch
          pushd ../scratch

          # Build IGVM
          git clone "${{ env.IGVM_REPO }}" \
            --branch="${{ env.IGVM_REF }}" \
            --depth=1

          pushd igvm

          # Installing Rust toolchain and tools from within this workflow step in in the
          # igvm checkout directory to avoid interference of the coconut-svsm rust-toolchain.toml,
          # which might override versions and target settings.
          rustup toolchain install "${{ env.RUST_VERSION_IGVM }}" --target x86_64-unknown-linux-gnu --profile minimal

          # Currently needed for the C wrapper of IGVM
          cargo install cbindgen

          PREFIX="$OUT" make -C igvm_c
          PREFIX="$OUT" make -C igvm_c install
          popd

          # Build Qmeu
           git clone "${{ env.QEMU_REPO }}" \
            --branch="${{ env.QEMU_REF }}" \
            --depth=1

          pushd qemu
          PKG_CONFIG_PATH="$OUT/lib64/pkgconfig" ./configure \
            --target-list=x86_64-softmmu \
            --enable-igvm --extra-ldflags=-L"$OUT/lib64" \
            --extra-cflags=-I"$OUT/include" \
            --enable-tcg \
            --enable-kvm \
            --enable-slirp \
            --enable-strip \
            --enable-vhost-kernel \
            --static \
            --disable-docs \
            --disable-user \
            --without-default-features \
            --prefix="$OUT"
          make -j "$(nproc)" install
          popd

          popd

      - name: Find companion Rust run and wait for IGVM artifact
        id: find_rust_run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Locate the Rust workflow run for this commit. The qemu workflow may
          # start before Rust has registered its run, so retry briefly.
          RUST_RUN_ID=""
          for _ in $(seq 1 30); do
            RUST_RUN_ID=$(gh run list --repo "$REPO" \
              --workflow "Rust" \
              --commit "$COMMIT_SHA" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')
            if [ -n "$RUST_RUN_ID" ]; then
              break
            fi
            echo "Companion Rust run not visible yet, retrying in 10s..."
            sleep 10
          done

          if [ -z "$RUST_RUN_ID" ]; then
            echo "Could not find a Rust workflow run for commit $COMMIT_SHA" >&2
            exit 1
          fi
          echo "Found companion Rust run: $RUST_RUN_ID"

          # Poll for the artifact to appear. Its presence means build-test-debug
          # finished successfully. Fail fast if the whole Rust run ends without
          # producing it.
          for _ in $(seq 1 180); do
            ARTIFACT_ID=$(gh api \
              "repos/$REPO/actions/runs/$RUST_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "coconut-igvm-artifact" and .expired == false) | .id' \
              | head -n1)
            if [ -n "$ARTIFACT_ID" ]; then
              echo "Artifact coconut-igvm-artifact is ready (id=$ARTIFACT_ID)"
              echo "rust_run_id=$RUST_RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            RUN_INFO=$(gh run view "$RUST_RUN_ID" --repo "$REPO" \
              --json status,conclusion \
              --jq '.status + "/" + (.conclusion // "")')
            case "$RUN_INFO" in
              completed/success)
                echo "Rust run completed successfully but artifact is missing." >&2
                exit 1
                ;;
              completed/*)
                echo "Rust run finished with non-success status: $RUN_INFO" >&2
                exit 1
                ;;
            esac

            echo "Artifact not ready (run status: $RUN_INFO), waiting 10s..."
            sleep 10
          done

          echo "Timed out waiting for coconut-igvm-artifact" >&2
          exit 1

      - name: Download coconut-test-qemu.igvm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coconut-igvm-artifact
          path: bin/
          run-id: ${{ steps.find_rust_run.outputs.rust_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install netcat used by test-in-svsm for vsock tests
        run: sudo apt install -y ncat

      - name: Set up vhost-vsock permissions
        run: sudo chmod 666 /dev/vhost-vsock

      ########################

      - name: Enable KVM diagnostic logging
        run: |
          echo Y | sudo tee /sys/module/kvm_amd/parameters/dump_invalid_vmcb || true
          echo Y | sudo tee /sys/module/kvm_intel/parameters/dump_invalid_vmcs || true

      - name: Run test-in-svsm in QEMU
        run: |
          # Use the pull request number for the port and the cid to avoid conflicts if two (or more)
          # actions run in parallel. On push-to-main events the PR number is empty, default to 0.
          # 1024 is the first non reserved port, 10 is an arbitrary number that should be safe enough
          # to avoid conflicts.
          PR_NUM=${{ github.event.pull_request.number }}
          VSOCK_PORT=$(( ${PR_NUM:-0} + 1024 ))
          VSOCK_CID=$(( ${PR_NUM:-0} + 10 ))
          QEMU=./citests/qemu/bin/qemu-system-x86_64 scripts/test-in-svsm.sh \
            --vsock-port $VSOCK_PORT --vsock-cid $VSOCK_CID \
            --nocc --timeout 180 \
            </dev/null 2>&1

      - name: Dump host kernel messages on QEMU or test failure
        if: failure()
        run: sudo dmesg
